<!-- Header -->
<header>
  <div class="header-stats">
    <i class="fas fa-briefcase"></i>
    <i class="fas fa-user-md"></i> 12
  </div>
  <div class="avatar">JD</div>
</header>

<!-- Hero & Search -->
<section class="hero">
  <div class="hero-text">
    <h1>Find your medical career</h1>
    <p>Only verified hospital jobs · apply directly</p>
  </div>
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search hospital jobs...">
    <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
  </div>
</section>

<!-- Filter chips -->
<div class="filter-section">
  <span class="filter-label"><i class="fas fa-filter"></i> Filters:</span>
  <button class="filter-chip active" data-filter="all">All Jobs</button>
  <button class="filter-chip" data-filter="nursing">Nursing</button>
  <button class="filter-chip" data-filter="doctor">Physicians</button>
</div>

<!-- Job Cards Section -->
<section class="job-list">
  <div class="job-card">
    <div class="card-accent"></div>
    <div class="job-info">
      <h3>Registered Nurse – ICU</h3>
      <p class="hospital-name"><i class="fas fa-hospital"></i> St. Mary's General Hospital</p>
      <div class="job-meta">
        <span><i class="fas fa-map-marker-alt"></i> Boston, MA</span>
        <span><i class="fas fa-clock"></i> 2 days ago</span>
      </div>
    </div>
  </div>
</section>

<!-- Payment Modal / Application Fee Section -->
<div class="payment-card">
  <div class="fee-container">
    <h4><i class="fas fa-credit-card"></i> Application fee</h4>
    <div class="price-tag">$49.99 <span>one-time</span></div>
    
    <div class="input-group">
      <label>CARD NUMBER</label>
      <input type="text" placeholder="4242 4242 4242 4242">
    </div>
    
    <div class="input-row">
      <div class="input-group">
        <label>EXPIRY</label>
        <input type="text" placeholder="MM/YY">
      </div>
      <div class="input-group">
        <label>CVC</label>
        <input type="text" placeholder="123">
      </div>
    </div>
  </div>
  <button class="pay-btn"><i class="fas fa-check-circle"></i> Pay & Apply</button>
</div>
